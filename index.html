<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Q*bert — Neon Pyramid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="Q*bert arcade game" tabindex="0"></canvas>
      <div id="touch" aria-label="Touch controls">
        <button data-move="ul">↖</button><button data-move="ur">↗</button
        ><button data-move="dl">↙</button><button data-move="dr">↘</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
